<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17131d">
  <meta name="description" content="Private, accessible C4-friendly feminine voice training.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg">
  <title>Julie Voice Studio</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,#40213a 0,transparent 35%),#130f18;color:#fff8fd;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}main{width:min(620px,100%);background:#231b2b;border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.38);text-align:center}.mark{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;margin:0 auto 18px;background:linear-gradient(145deg,#4a304e,#292033);font-size:36px;border:1px solid #e9a8c8}h1{font-size:clamp(2rem,7vw,3.4rem);margin:0 0 10px}p{font-size:1.1rem;color:#cdbfce;line-height:1.55}.track{height:14px;background:#352a40;border-radius:999px;overflow:hidden;margin:24px 0 12px}.fill{height:100%;width:0;background:linear-gradient(90deg,#e9a8c8,#b8a5e6);transition:width .2s}#status{font-weight:700;color:#f5dce9}button{min-height:58px;width:100%;border:0;border-radius:18px;background:#e9a8c8;color:#231724;font-size:1.05rem;font-weight:850;padding:14px 20px;margin-top:16px;display:none}.error button{display:block}
  </style>
</head>
<body>
<main id="loaderCard">
  <div class="mark" aria-hidden="true">🎙️</div>
  <h1>Julie Voice Studio</h1>
  <p>Restoring the full English voice coach…</p>
  <div class="track" role="progressbar" aria-label="Loading app" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
  <div id="status" aria-live="polite">Preparing the full app</div>
  <button id="retry" type="button">Try loading again</button>
</main>
<script>
const CHUNKS=["./chunks/app-01.b64","./chunks/app-02.b64","./chunks/app-03.b64","./chunks/app-04.b64","./chunks/app-05.b64","./chunks/app-06.b64","./chunks/app-07.b64","./chunks/app-08.b64","./chunks/app-09.b64","./chunks/app-10.b64","./chunks/app-11.b64"];
const ENGLISH_PATCH=`<script>
(function(){
  document.documentElement.lang='en-AU';
  function chooseEnglishVoice(){
    const voices=(window.speechSynthesis&&speechSynthesis.getVoices)?speechSynthesis.getVoices():[];
    return voices.find(v=>/^en-AU$/i.test(v.lang))||voices.find(v=>/^en-GB$/i.test(v.lang))||voices.find(v=>/^en-US$/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null;
  }
  if('speechSynthesis' in window){
    const originalSpeak=speechSynthesis.speak.bind(speechSynthesis);
    speechSynthesis.speak=function(utterance){
      try{
        const voice=chooseEnglishVoice();
        utterance.lang=voice?.lang||'en-AU';
        if(voice) utterance.voice=voice;
      }catch(e){utterance.lang='en-AU';}
      return originalSpeak(utterance);
    };
    speechSynthesis.onvoiceschanged=function(){
      const select=document.getElementById('voiceSelect');
      if(select){
        const options=[...select.options];
        const preferred=options.find(o=>/en-AU/i.test(o.textContent))||options.find(o=>/en-GB/i.test(o.textContent))||options.find(o=>/English|\ben[-_]/i.test(o.textContent));
        if(preferred){select.value=preferred.value;select.dispatchEvent(new Event('change',{bubbles:true}));}
      }
    };
  }
})();
<\/script>`;
async function loadApp(){
  const card=document.getElementById('loaderCard'),fill=document.getElementById('fill'),status=document.getElementById('status'),track=document.querySelector('[role=progressbar]');
  card.classList.remove('error');
  try{
    let encoded='';
    for(let i=0;i<CHUNKS.length;i++){
      status.textContent=`Loading full app ${i+1} of ${CHUNKS.length}`;
      const response=await fetch(CHUNKS[i],{cache:'reload'});
      if(!response.ok) throw new Error(`Missing app part ${i+1}`);
      encoded+=await response.text();
      const pct=Math.round(((i+1)/CHUNKS.length)*100);
      fill.style.width=pct+'%';track.setAttribute('aria-valuenow',String(pct));
    }
    status.textContent='Starting the English voice coach';
    const binary=atob(encoded.replace(/\s/g,''));
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    let appHtml=new TextDecoder('utf-8').decode(bytes);
    appHtml=appHtml.replace(/<html\s+lang=["'][^"']*["']/i,'<html lang="en-AU"');
    appHtml=appHtml.replace('</body>',ENGLISH_PATCH+'</body>');
    document.open();document.write(appHtml);document.close();
  }catch(error){
    console.error(error);status.textContent='The full app could not finish loading. Refresh once, then try again.';card.classList.add('error');
  }
}
document.getElementById('retry').addEventListener('click',loadApp);
loadApp();
if('serviceWorker' in navigator){
  window.addEventListener('load',async()=>{
    try{const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});await reg.update();}catch(e){console.warn(e);}
  });
}
</script>
</body></html>
